[workspace]
resolver = "2"
members = [
    "crates/localcode-core",
    "crates/localcode-cli",
    "crates/engram-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Svetozar Technologies"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
thiserror = "2"
log = "0.4"
git2 = "0.19"
ignore = "0.4"
walkdir = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
notify = "7"
openssl = { version = "0.10", features = ["vendored"] }

# Engram memory engine dependencies
bincode = "1"
memmap2 = "0.9"
petgraph = "0.6"
compact_str = { version = "0.8", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"
tracing = "0.1"
anyhow = "1"
ordered-float = { version = "4", features = ["serde"] }
rand = "0.8"
bytes = "1"
crc32fast = "1"
arc-swap = "1.9.0"
ort = "2.0.0-rc.12"
tokenizers = "0.21"

# Internal
engram-core = { path = "crates/engram-core" }
